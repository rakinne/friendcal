name: FriendCal
options:
  bundleIdPrefix: com.friendcal
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

# DEVELOPMENT_TEAM comes from Local.xcconfig (gitignored, optional include), so a team
# picked per machine survives `xcodegen generate`. See Signing.xcconfig.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.5.0"

targets:
  FriendCalCore:
    type: framework
    platform: iOS
    deploymentTarget: "18.0"
    supportedDestinations: [iOS]
    sources:
      - FriendCal/Models
      - FriendCal/Services
      - FriendCal/Privacy
      - FriendCal/Shared
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_NAME: FriendCalCore
        EXECUTABLE_NAME: FriendCalCore
        ENABLE_TESTABILITY: YES
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
  FriendCal:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    supportedDestinations: [iOS]
    bundleId: com.friendcal.app
    entitlements:
      path: FriendCal/FriendCal.entitlements
      properties:
        # Sign in with Apple (native signInWithIdToken). The App ID must also have the capability
        # enabled in the Apple Developer portal, or automatic signing refuses the profile.
        com.apple.developer.applesignin:
          - Default
    info:
      path: FriendCal/Info.plist
      properties:
        CFBundleDisplayName: FriendCal
        CFBundleName: FriendCal
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        # Issue #5 D3: friendcal://proposal/<id>; DeepLink.scheme is the Swift constant and
        # DeepLinkBundleTests asserts the two match.
        CFBundleURLTypes:
          - CFBundleURLName: com.friendcal.app.proposal
            CFBundleURLSchemes:
              - friendcal
        UIAppFonts:
          - CabinetGrotesk-Extrabold.otf
          - CabinetGrotesk-Bold.otf
          - SourceSans3-Regular.otf
          - SourceSans3-Semibold.otf
          - SourceSans3-Bold.otf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSRequiresIPhoneOS: true
        # Standard HTTPS only (Supabase); skips the per-build export-compliance prompt in TestFlight.
        ITSAppUsesNonExemptEncryption: false
        # Network store config, filled from Config/Local.xcconfig (gitignored). Empty or unexpanded
        # means the app falls back to the in-memory store. The anon key is a public client key; RLS is
        # what protects the data.
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
    settings:
      base:
        INFOPLIST_FILE: FriendCal/Info.plist
        PRODUCT_NAME: FriendCal
        EXECUTABLE_NAME: FriendCal
        PRODUCT_BUNDLE_IDENTIFIER: com.friendcal.app
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    sources:
      # Models/, Services/, Privacy/ and Shared/ compile only into FriendCalCore (D14).
      - FriendCal/FriendCalApp.swift
      # Referenced by configFiles; listed here so the project file ref gets a stable id.
      - path: Config/Signing.xcconfig
        buildPhase: none
      - FriendCal/Views
      - path: FriendCal/Fixtures
        optional: true
      - path: FriendCal/Resources/Fonts
        optional: true
        buildPhase: resources
      - path: FriendCal/Assets.xcassets
        optional: true
      # Secrets.plist is gitignored and nothing reads it yet, so it is not a build input:
      # XcodeGen's `optional` only applies at generation time, and a project generated on a
      # machine that has the file breaks every fresh clone (AC8). Add a config path when the
      # Supabase backend is wired.
    preBuildScripts:
      # D7: fail every configuration (incl. Release archives) when a font is
      # missing. Cabinet Grotesk is gitignored, so fresh clones hit this.
      - name: Check bundled fonts
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/FriendCal/Resources/Fonts/CabinetGrotesk-Extrabold.otf
          - $(SRCROOT)/FriendCal/Resources/Fonts/CabinetGrotesk-Bold.otf
          - $(SRCROOT)/FriendCal/Resources/Fonts/SourceSans3-Regular.otf
          - $(SRCROOT)/FriendCal/Resources/Fonts/SourceSans3-Semibold.otf
          - $(SRCROOT)/FriendCal/Resources/Fonts/SourceSans3-Bold.otf
          - $(SRCROOT)/FriendCal/Resources/Fonts/JetBrainsMono-Regular.ttf
          - $(SRCROOT)/FriendCal/Resources/Fonts/JetBrainsMono-Medium.ttf
        script: |
          status=0
          for f in CabinetGrotesk-Extrabold.otf CabinetGrotesk-Bold.otf \
                   SourceSans3-Regular.otf SourceSans3-Semibold.otf SourceSans3-Bold.otf \
                   JetBrainsMono-Regular.ttf JetBrainsMono-Medium.ttf; do
            if [ ! -f "${SRCROOT}/FriendCal/Resources/Fonts/$f" ]; then
              echo "error: Missing font $f: run scripts/fetch-fonts.sh"
              status=1
            fi
          done
          exit $status
    dependencies:
      - target: FriendCalCore
  FriendCalTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    supportedDestinations: [iOS]
    sources:
      - FriendCalTests
    dependencies:
      - target: FriendCalCore
      - target: FriendCal
    settings:
      base:
        PRODUCT_NAME: FriendCalTests
        EXECUTABLE_NAME: FriendCalTests
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
  FriendCalUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    supportedDestinations: [iOS]
    sources:
      - FriendCalUITests
    dependencies:
      - target: FriendCal
    settings:
      base:
        PRODUCT_NAME: FriendCalUITests
        TEST_TARGET_NAME: FriendCal
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO

schemes:
  FriendCal:
    build:
      targets:
        FriendCal: all
    test:
      config: Debug
      targets:
        - FriendCalTests
        - FriendCalUITests
      gatherCoverageData: true
    run:
      config: Debug
    archive:
      config: Release

